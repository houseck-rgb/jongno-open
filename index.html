onchange=()=>{const i=x.dataset.check;if(!state.started)state.started=tm();state.done[i]=x.checked;x.checked?state.times[i]=tm():delete state.times[i];save()});document.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>document.querySelector('[data-input="'+b.dataset.shot+'"]').click());document.querySelectorAll('[data-example-shot]').forEach(b=>b.onclick=()=>document.querySelector('[data-input="'+b.dataset.exampleShot+'"]').click());document.querySelectorAll('[data-input]').forEach(i=>i.onchange=x=>take(x,i.dataset.input));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete state.photos[b.dataset.remove];save()})}function take(ev,k){const f=ev.target.files[0];if(!f)return;if(!state.started)state.started=tm();const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);state.photos[k]={data:c.toDataURL('image/jpeg',.82),time:tm()};URL.revokeObjectURL(u);save();toast('사진과 촬영 시간이 저장됐어요')};im.src=u}function stats(){const d=Object.values(state.done).filter(Boolean).length,p=Object.keys(state.photos).length,pc=Math.round((d/9*.7+p/8*.3)*100),times=Object.values(state.times);doneStat.textContent=d+'/9';photoStat.textContent=p+'/8';percent.textContent=pc+'%';ring.style.setProperty('--p',(pc*3.6)+'deg');startTime.textContent=state.started||'--:--';lastTime.textContent=times.at(-1)||Object.values(state.photos).at(-1)?.time||'--:--';shareSub.textContent='사진 '+p+'장 · 완료 '+d+'건'}function file(data,name){const a=data.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new File([u],name,{type:m})}function report(){const day=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());return ['[종로점 홀 오픈 보고]',day,'사진 '+Object.keys(state.photos).length+'/8장','',...tasks.map((x,i)=>(state.done[i]?'✅':'⬜')+' '+(i+1)+'. '+x.t+(state.times[i]?' ('+state.times[i]+')':''))].join('\n')}share.onclick=async()=>{const text=report(),labels=['입간판_앞','입간판_뒤','외부메뉴판_전기선','어플실행_3개','연결장치_1페이지','연결장치_2페이지','음악_볼륨','음악_채널'],files=Object.entries(state.photos).sort().map(([k,p],i)=>file(p.data,String(i+1).padStart(2,'0')+'_'+(labels[i]||'오픈사진')+'.jpg'));try{if(files.length&&navigator.canShare?.({files}))await navigator.share({title:'종로점 홀 오픈 보고',text,files});else if(navigator.share){await navigator.share({title:'종로점 홀 오픈 보고',text});if(files.length)toast('기기에서 사진 동시 공유를 지원하지 않아요')}else{await navigator.clipboard.writeText(text);toast('보고 내용이 복사됐어요')}}catch(x){if(x.name!=='AbortError')toast('공유하지 못했어요')}};reset.onclick=()=>{if(confirm('오늘의 사진과 완료 기록을 모두 지울까요?')){localStorage.removeItem('jongno-open-pro-v3');location.reload()}};function toast(t){const x=document.querySelector('.toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1900)}render();
</script></body></html>
