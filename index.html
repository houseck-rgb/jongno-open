.format(new Date())}function save(){localStorage.setItem('jongno-open-pro-v3',JSON.stringify(state));render()}function shot(i,j,l){const k=i+'-'+j,p=state.photos[k];return '<div class="shot">'+(p?'<img src="'+p.data+'" alt="'+e(l)+'"><button class="remove" data-remove="'+k+'">×</button><div class="photo-label">'+e(l)+' · '+p.time+'</div>':'<button class="shoot" data-shot="'+k+'">'+icons.camera+e(l)+'</button><input hidden type="file" accept="image/*" capture="environment" data-input="'+k+'">')+'</div>'}function render(){let n=0;content.innerHTML=groups.map(g=>{const cards=g.items.map(x=>{const i=n++,shots=(x.p||[]).map((l,j)=>shot(i,j,l)).join('');return '<article class="task '+(state.done[i]?'done':'')+' '+(x.t.length>36?'wide':'')+'"><div class="num">'+(i+1)+'</div><label class="tick"><input type="checkbox" data-check="'+i+'" '+(state.done[i]?'checked':'')+'></label><div class="task-title">'+e(x.t)+'</div>'+(state.times[i]?'<div class="time">✓ '+state.times[i]+' 완료</div>':'')+(shots?'<div class="shots">'+shots+'</div>':'')+(x.ex?'<div class="example-wrap"><div class="example-title">'+({sign:'촬영 예시 · 입간판 앞과 뒤',wire:'촬영 예시 · 전기선 위치가 보이게 찍어주세요',pos:'촬영 예시 · 화면 3곳을 각각 찍어주세요',music:'촬영 예시 · 볼륨 29와 음악 채널'}[x.ex])+'</div><div class="examples '+x.ex+'">'+({sign:signExamples,wire:[wireExample],pos:posExamples,music:musicExamples}[x.ex]).map((src,q)=>'<figure class="'+(x.ex==='wire'?'wire-photo':'')+'"><button class="example-shot" data-example-shot="'+i+'-'+q+'"><img src="'+src+'" alt="촬영 예시"><span class="example-camera '+(state.photos[i+'-'+q]?'saved':'')+'">'+(state.photos[i+'-'+q]?'✓<small>'+state.photos[i+'-'+q].time+' · 다시 촬영</small>':'📷<small>눌러서 촬영</small>')+'</span></button>'+(x.ex==='wire'?'<span class="wire-mark"><b>↘</b> 전기선이 보이게</span>':x.ex==='music'&&q===0?'<span class="volume-mark">볼륨 29</span>':'')+'<figcaption>'+({sign:['입간판 앞','입간판 뒤'],wire:['외부 메뉴판 전기선'],pos:['어플 실행 3개','연결 1','연결 2'],music:['볼륨 29','음악 채널']}[x.ex][q])+'</figcaption></figure>').join('')+'</div></div>':'')+'</article>'}).join('');return '<section class="section"><aside class="rail"><h2>'+g.n+'</h2>'+icons[g.i]+'<p>'+g.d+'</p><div class="section-complete"><span></span>'+g.items.filter((_,j)=>state.done[tasks.indexOf(g.items[j])]).length+'/'+g.items.length+' 완료</div></aside><div class="cards">'+cards+'</div></section>'}).join('');bind();stats()}function bind(){document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{const i=x.dataset.check;if(!state.started)state.started=tm();state.done[i]=x.checked;x.checked?state.times[i]=tm():delete state.times[i];save()});document.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>document.querySelector('[data-input="'+b.dataset.shot+'"]').click());document.querySelectorAll('[data-example-shot]').forEach(b=>b.onclick=()=>document.querySelector('[data-input="'+b.dataset.exampleShot+'"]').click());document.querySelectorAll('[data-input]').forEach(i=>i.onchange=x=>take(x,i.dataset.input));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete state.photos[b.dataset.remove];save()})}function take(ev,k){const f=ev.target.files[0];if(!f)return;if(!state.started)state.started=tm();const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);state.photos[k]={data:c.toDataURL('image/jpeg',.82),time:tm()};URL.revokeObjectURL(u);save();toast('사진과 촬영 시간이 저장됐어요')};im.src=u}function stats(){const d=Object.values(state.done).filter(Boolean).length,p=Object.keys(state.photos).length,pc=Math.round((d/9*.7+p/8*.3)*100),times=Object.values(state.times);doneStat.textContent=d+'/9';photoStat.textContent=p+'/8';percent.textContent=pc+'%';ring.style.setProperty('--p',(pc*3.6)+'deg');startTime.textContent=state.started||'--:--';lastTime.textContent=times.at(-1)||Object.values(state.photos).at(-1)?.time||'--:--';shareSub.textContent='사진 '+p+'장 · 완료 '+d+'건'}function file(data,name){const a=data.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new File([u],name,{type:m})}function report(){const day=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());return ['[종로점 홀 오픈 보고]',day,'사진 '+Object.keys(state.photos).length+'/8장','',...tasks.map((x,i)=>(state.done[i]?'✅':'⬜')+' '+(i+1)+'. '+x.t+(state.times[i]?' ('+state.times[i]+')':''))].join('\n')}function reportImage(){return new Promise(resolve=>{const day=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date()),lines=tasks.map((x,i)=>{const pc=x.p?x.p.filter((_,j)=>state.photos[i+'-'+j]).length+'/'+x.p.length:'';return (state.done[i]?'✅':'⬜')+' '+(i+1)+'. '+x.t+(state.times[i]?' ('+state.times[i]+')':'')+(pc?' · 사진 '+pc:'')}),c=document.createElement('canvas'),ctx=c.getContext('2d'),W=1200,pad=76,lineH=54;ctx.font='700 32px sans-serif';const wrapped=[];lines.forEach(line=>{let cur='';for(const ch of line){if(ctx.measureText(cur+ch).width>W-pad*2){wrapped.push(cur);cur=ch}else cur+=ch}wrapped.push(cur)});c.width=W;c.height=250+wrapped.length*lineH+90;ctx.fillStyle='#f8f5ee';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#102f55';ctx.font='900 50px sans-serif';ctx.fillText('종로점 홀 오픈 보고',pad,82);ctx.strokeStyle='#5eb6aa';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(pad,112);ctx.lineTo(W-pad,112);ctx.stroke();ctx.font='600 27px sans-serif';ctx.fillStyle='#647181';ctx.fillText(day,pad,160);ctx.fillText('필수 사진 '+Object.keys(state.photos).length+'/8장',W-350,160);ctx.font='700 30px sans-serif';ctx.fillStyle='#183451';let y=230;wrapped.forEach(line=>{ctx.fillText(line,pad,y);y+=lineH});ctx.font='600 22px sans-serif';ctx.fillStyle='#6e7a83';ctx.fillText('최우영스시야 · 종로점',pad,c.height-45);c.toBlob(blob=>resolve(new File([blob],'00_종로점_홀_오픈_보고.jpg',{type:'image/jpeg'})),'image/jpeg',.9)})}share.onclick=async()=>{const labels=['입간판_앞','입간판_뒤','외부메뉴판_전기선','어플실행_3개','연결장치_1페이지','연결장치_2페이지','음악_볼륨','음악_채널'],photos=Object.entries(state.photos).sort().map(([k,p],i)=>file(p.data,String(i+1).padStart(2,'0')+'_'+(labels[i]||'오픈사진')+'.jpg')),summary=await reportImage(),files=[summary,...photos];try{if(navigator.canShare?.({files}))await navigator.share({title:'종로점 홀 오픈 보고',files});else toast('주소로 연 뒤 공유해 주세요')}catch(x){if(x.name!=='AbortError')toast('공유하지 못했어요')}};reset.onclick=()=>{if(confirm('오늘의 사진과 완료 기록을 모두 지울까요?')){localStorage.removeItem('jongno-open-pro-v3');location.reload()}};function toast(t){const x=document.querySelector('.toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1900)}render();
